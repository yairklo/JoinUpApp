name: Playwright

# PRs into dev / Dev. A failed job fails the check. Marking "web regression"
# as a required status check (GitHub branch protection) is an owner click —
# this file cannot set that.
on:
  pull_request:
    branches: [dev, Dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: web regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: joinup
          POSTGRES_PASSWORD: joinup
          POSTGRES_DB: joinup_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U joinup -d joinup_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      BASE_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:3005
      DATABASE_URL: postgresql://joinup:joinup@localhost:5432/joinup_e2e?schema=public
      DIRECT_DATABASE_URL: postgresql://joinup:joinup@localhost:5432/joinup_e2e?schema=public
      JOINUP_SEED_CONFIRM: dev
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3005
      PORT: "3005"
      E2E_SERVER_NODE_ENV: development
      ALLOW_DISK_UPLOADS: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            next_app/package-lock.json
            e2e/package-lock.json

      - name: Refuse live Clerk keys
        run: |
          set -euo pipefail
          case "$CLERK_SECRET_KEY" in
            sk_test_*) ;;
            sk_live_*) echo "CLERK_TEST_SECRET_KEY is a live key. Refusing."; exit 1 ;;
            *) echo "Set repository secret CLERK_TEST_SECRET_KEY (sk_test_)."; exit 1 ;;
          esac
          case "$CLERK_PUBLISHABLE_KEY" in
            pk_test_*) ;;
            pk_live_*) echo "CLERK_TEST_PUBLISHABLE_KEY is a live key. Refusing."; exit 1 ;;
            *) echo "Set repository secret CLERK_TEST_PUBLISHABLE_KEY (pk_test_)."; exit 1 ;;
          esac
          if [ -n "${OPENAI_API_KEY}" ] || [ -n "${GOOGLE_API_KEY}" ]; then
            echo "E2E_MODERATION_READY=1" >> "$GITHUB_ENV"
          else
            echo "E2E_MODERATION_READY=0" >> "$GITHUB_ENV"
            echo "No moderation key. Meeting/phone/link chat tests will skip."
          fi

      - name: Install server
        working-directory: server
        run: npm ci

      - name: Install web
        working-directory: next_app
        run: npm ci

      - name: Build web
        working-directory: next_app
        run: npx next build

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run web regression
        working-directory: e2e
        run: npx playwright test

      - name: Upload traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
