# Resource ceilings so a runaway process cannot take the whole VPS (and Caddy) down.
# Loaded automatically through COMPOSE_FILE in .env (see .env.example), so manual `docker compose`
# commands in deploy/ use it too. Tune via .env; defaults are safe on a 1 vCPU / 1-2 GB VPS.
services:
  api:
    mem_limit: ${API_MEM_LIMIT:-768m}
    cpus: ${API_CPUS:-1}
  worker:
    mem_limit: ${WORKER_MEM_LIMIT:-384m}
    cpus: ${API_CPUS:-1}
  redis:
    mem_limit: 192m
