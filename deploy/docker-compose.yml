# JoinUp production stack. Run from this directory (or via deploy.sh).
#   api    : Express + Socket.IO (server/Dockerfile, port 3005, internal only)
#   worker : optional dedicated background-jobs process (profile "worker")
#   (the web app is hosted on Vercel, not here)
#   redis  : Socket.IO fan-out / rate limits
#   caddy  : TLS + reverse proxy, the only service publishing ports
# Image tags come from IMAGE_TAG (a git short SHA, set by deploy.sh) so rollback = re-run with an older tag.

name: joinup

x-restart: &restart unless-stopped

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    image: joinup-api:${IMAGE_TAG:-latest}
    build:
      context: ../server
      dockerfile: Dockerfile
    # The image CMD runs `prisma migrate deploy` on boot. Migrations are a deliberate step in
    # deploy.sh instead, so a rollback never re-runs them: start the server directly.
    command: ["node", "index.js"]
    restart: *restart
    env_file: api.env
    environment:
      NODE_ENV: production
      PORT: "3005"
      # Set API_RUN_BACKGROUND_JOBS=false in .env when the worker profile is on (deploy.sh enforces it).
      RUN_BACKGROUND_JOBS: ${API_RUN_BACKGROUND_JOBS:-true}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3005"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3005/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  # Dedicated jobs process. Enabling it REQUIRES API_RUN_BACKGROUND_JOBS=false in .env so jobs do not
  # run twice (deploy.sh refuses otherwise). PR #370 adds a Redis leader lock (JOBS_LEADER_LOCK); align then.
  worker:
    image: joinup-api:${IMAGE_TAG:-latest}
    profiles: ["worker"]
    command: ["node", "worker.js"]
    restart: *restart
    env_file: api.env
    environment:
      NODE_ENV: production
      RUN_BACKGROUND_JOBS: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: *restart
    # Redis only holds ephemeral data (pub/sub, rate limits): no persistence, evict volatile keys.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: *restart
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data   # TLS certs + ACME account: keep/back up, or you hit Let's Encrypt rate limits
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
