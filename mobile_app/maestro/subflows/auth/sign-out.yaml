# Signs the current user out via the profile screen; ends on the sign-in screen.
appId: com.yairklo.joinupapp
---
- tapOn:
    id: header-profile
- scrollUntilVisible:
    element:
      id: profile-sign-out
- tapOn:
    id: profile-sign-out
- extendedWaitUntil:
    visible:
      id: sign-in-to-sign-up
    timeout: 30000
