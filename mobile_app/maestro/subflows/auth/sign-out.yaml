# Signs the current user out via the profile screen; ends on the sign-in screen.
appId: com.yairklo.joinupapp
---
# Game screens hide the profile shortcut; it lives in the tab headers.
- tapOn:
    id: tab-home
- tapOn:
    id: header-profile
- tapOn:
    id: header-menu-profile
- scrollUntilVisible:
    element:
      id: profile-sign-out
- tapOn:
    id: profile-sign-out
- extendedWaitUntil:
    visible:
      id: sign-in-to-sign-up
    timeout: 30000
