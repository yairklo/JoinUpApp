# Cold start with wiped app data so every flow begins signed out.
appId: com.yairklo.joinupapp
---
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      notifications: allow
      location: allow
# Safety net if a runtime permission prompt still appears (OS-level ids, stable across locales).
- tapOn:
    id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button"
    optional: true
- tapOn:
    id: "com.android.permissioncontroller:id/permission_allow_button"
    optional: true
# CI emulator race: clearState kills the old task while the new process is starting, so the app can
# be killed mid-launch and sit on the splash forever ("failed to attach"). If the sign-in screen does
# not show up, relaunch (data is already wiped) - twice at most.
- extendedWaitUntil:
    visible:
      id: sign-in-to-sign-up
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: sign-in-to-sign-up
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in-to-sign-up
          timeout: 20000
          optional: true
- runFlow:
    when:
      notVisible:
        id: sign-in-to-sign-up
    commands:
      - launchApp:
          stopApp: true
