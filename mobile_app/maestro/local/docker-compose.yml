# Throwaway Postgres for the local E2E backend (port 5544 to avoid clashing with a dev DB).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: joinup
      POSTGRES_PASSWORD: joinup
      POSTGRES_DB: joinup_e2e
    ports:
      - "5544:5432"
    tmpfs:
      - /var/lib/postgresql/data   # wiped on every `down`: the "reset" story
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joinup -d joinup_e2e"]
      interval: 3s
      retries: 20
