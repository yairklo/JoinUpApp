appId: com.yairklo.joinupapp
name: Join a game created by another user
tags:
  - smoke
  - game
---
- runScript: ../scripts/gen-run-data.js
- runFlow: ../subflows/common/launch-clean.yaml
# User A hosts the game ...
- runFlow:
    file: ../subflows/auth/sign-up.yaml
    env:
      EMAIL: ${output.emailA}
      PASSWORD: ${output.password}
- runFlow:
    file: ../subflows/game/create.yaml
    env:
      GAME_TITLE: ${output.gameTitle}
- runFlow: ../subflows/auth/sign-out.yaml
# ... user B finds it on the home list and joins.
- runFlow:
    file: ../subflows/auth/sign-up.yaml
    env:
      EMAIL: ${output.emailB}
      PASSWORD: ${output.password}
# The game is booked for tomorrow (see pick-future-slot); the home list opens on today.
- scrollUntilVisible:
    element:
      id: home-date-1
    timeout: 30000
- tapOn:
    id: home-date-1
- scrollUntilVisible:
    element: ${output.gameTitle}
    timeout: 60000
- tapOn: ${output.gameTitle}
- extendedWaitUntil:
    visible:
      id: game-join-button
    timeout: 30000
- tapOn:
    id: game-join-button
# Join confirms with a native alert that covers the chat button until it is dismissed.
- extendedWaitUntil:
    visible:
      id: "android:id/button1"
    timeout: 30000
- tapOn:
    id: "android:id/button1"
# A joined player gets the chat entry point instead of the join button.
- extendedWaitUntil:
    visible:
      id: game-open-chat
    timeout: 30000
- assertNotVisible:
    id: game-join-button
