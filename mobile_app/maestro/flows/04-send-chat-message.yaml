appId: com.yairklo.joinupapp
name: Send a chat message in a game chat
tags:
  - smoke
  - chat
---
- runScript: ../scripts/gen-run-data.js
- runFlow: ../subflows/common/launch-clean.yaml
- runFlow:
    file: ../subflows/auth/sign-up.yaml
    env:
      EMAIL: ${output.emailA}
      PASSWORD: ${output.password}
- runFlow:
    file: ../subflows/game/create.yaml
    env:
      GAME_TITLE: ${output.gameTitle}
# The organizer is a participant of their own game, so the chat entry point is shown.
- extendedWaitUntil:
    visible:
      id: game-open-chat
    timeout: 30000
- tapOn:
    id: game-open-chat
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 30000
- tapOn:
    id: chat-input
- inputText: ${output.chatMessage}
- tapOn:
    id: chat-send
- extendedWaitUntil:
    visible: ${output.chatMessage}
    timeout: 20000
