appId: com.yairklo.joinupapp
---
# One theme pass over the PR2 screens, navigating by taps only (no openLink): on the Android dev client an
# incoming VIEW intent after the dark toggle re-creates the activity and the app loops between themes.
# Env: THEME, LANG (he|en, file names only), TAG (before|after). Starts and ends on the home tab.
- extendedWaitUntil:
    visible:
      id: home-create-game
    timeout: 60000
- runFlow: theme.yaml
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '1500'

- tapOn:
    id: header-profile
- tapOn:
    id: header-menu-settings
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '4000'
- takeScreenshot:
    path: ${TAG}/settings-${LANG}-${THEME}

- tapOn:
    text: 'התראות|Notifications'
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '5000'
- takeScreenshot:
    path: ${TAG}/settings-notifications-${LANG}-${THEME}
- back

- tapOn:
    text: 'הגדרות פרטיות|Privacy Settings'
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '4000'
- takeScreenshot:
    path: ${TAG}/privacy-settings-${LANG}-${THEME}
- scrollUntilVisible:
    element:
      text: 'דיווח על באג.*|Report a Bug.*'
    optional: true
- tapOn:
    text: 'דיווח על באג.*|Report a Bug.*'
    optional: true
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '2500'
- takeScreenshot:
    path: ${TAG}/settings-feedback-${LANG}-${THEME}
- back
- back

- tapOn:
    text: 'משתמשים חסומים|Blocked users'
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '4000'
- takeScreenshot:
    path: ${TAG}/settings-blocked-${LANG}-${THEME}
- back
- back

- tapOn:
    text: 'חברים|Friends'
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '5000'
- takeScreenshot:
    path: ${TAG}/friends-${LANG}-${THEME}

# Friend profile: open the first friend row (adult-b, יונתן לוי) when the seeded friendship exists.
- tapOn:
    text: 'יונתן לוי'
    optional: true
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '5000'
- takeScreenshot:
    path: ${TAG}/user-profile-${LANG}-${THEME}
- back
- tapOn:
    text: 'בית|Home'
    optional: true
