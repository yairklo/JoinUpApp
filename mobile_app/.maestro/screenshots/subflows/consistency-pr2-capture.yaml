appId: com.yairklo.joinupapp
---
# Env: LANG (he|en, file names only), TAG (before|after). Light mode, deep links.
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '2000'
- openLink: mobileapp:///settings
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '4000'
- takeScreenshot:
    path: ${TAG}/settings-${LANG}-light

- openLink: mobileapp:///settings/notifications
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '5000'
- takeScreenshot:
    path: ${TAG}/settings-notifications-${LANG}-light

- openLink: mobileapp:///settings/blocked
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '4000'
- takeScreenshot:
    path: ${TAG}/settings-blocked-${LANG}-light

- openLink: mobileapp:///settings/feedback
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '2500'
- takeScreenshot:
    path: ${TAG}/settings-feedback-${LANG}-light

- openLink: mobileapp:///profile/settings
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '4000'
- takeScreenshot:
    path: ${TAG}/privacy-settings-${LANG}-light

- openLink: mobileapp:///friends
- runFlow:
    file: pause.yaml
    env:
      PAUSE_MS: '5000'
- takeScreenshot:
    path: ${TAG}/friends-${LANG}-light
