appId: com.yairklo.joinupapp
name: profile screens
---
- runFlow: subflows/session.yaml
- tapOn:
    id: header-profile
- tapOn:
    id: header-menu-profile
- extendedWaitUntil:
    visible: 'adult-a.*example.com'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot:
    path: profile/profile-${THEME}
