appId: com.yairklo.joinupapp
name: profile screens
---
- runFlow: subflows/session.yaml
- tapOn:
    id: header-profile
- extendedWaitUntil:
    visible: 'adult-a.*example.com'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot:
    path: ../../../docs/design-screens/mobile/profile/profile-${THEME}
- openLink: joinup://profile/settings
- waitForAnimationToEnd
- takeScreenshot:
    path: ../../../docs/design-screens/mobile/profile/profile-settings-${THEME}
