appId: com.yairklo.joinupapp
name: consistency pr2 (settings, profile, friends)
---
# One language per run (LANG = he | en, used in file names). The app language comes from the device
# locale on a fresh install: run.mjs-style `pm clear` + `cmd locale set-system-locales` before each run.
# Avoid the in-app HE/EN toggle: its RTL reload loops on a slow emulator.
- runFlow:
    file: subflows/consistency-session.yaml
    env:
      THEME: light
- runFlow:
    file: subflows/consistency-pr2-capture.yaml
    env:
      THEME: light
- runFlow:
    file: subflows/consistency-pr2-capture.yaml
    env:
      THEME: dark
